services:
  # ==============================================
  # KEYCLOAK - Servidor de Autenticación
  # ==============================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: proyecto2-keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

  # ==============================================
  # ZIPKIN - Visualizador de Trazas
  # ==============================================
  zipkin:
    image: openzipkin/zipkin
    container_name: proyecto2-zipkin
    ports:
      - "9411:9411"

  # ==============================================
  # MYSQL - Base de datos relacional
  # ==============================================
  mysql:
    image: mysql:8.4
    container_name: proyecto2-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql-data:/var/lib/mysql

  # ==============================================
  # MONGODB - Base de datos NoSQL
  # ==============================================
  mongodb:
    image: mongo:8
    container_name: proyecto2-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

# ==============================================
# VOLÚMENES PARA PERSISTENCIA DE DATOS
# ==============================================
volumes:
  mysql-data:
  mongodb-data: